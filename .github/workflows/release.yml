name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/rmtunnel-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/rmtunnel-linux-arm64 .
          cd dist && sha256sum rmtunnel-linux-* > SHA256SUMS

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rmtunnel-linux-amd64
            dist/rmtunnel-linux-arm64
            dist/SHA256SUMS
